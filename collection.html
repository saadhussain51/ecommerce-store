<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collections - Calvier Essence</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .collection-group { margin-bottom: 60px; }
        .collection-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .collection-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
        }
        /* Category Cards Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin-top: 30px;
        }
        @media(max-width: 992px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width: 600px) { .category-grid { grid-template-columns: 1fr; } }
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .category-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(212,175,55,0.15);
        }
        .category-card i {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 15px;
        }
        .category-card h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .category-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .category-card .card-btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--gold);
            color: #000;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
        }
.category-count {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(212,175,55,0.15);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        /* Quick View Modal Styles - Luxury Design */
        .quick-view-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .quick-view-content {
            background: linear-gradient(145deg, #1e1e1e 0%, #141414 100%);
            border: 1px solid rgba(212,175,55,0.35);
            width: 90%;
            max-width: 820px;
            padding: 30px;
            position: relative;
            border-radius: 18px;
            display: flex;
            gap: 35px;
            flex-wrap: wrap;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 40px rgba(212,175,55,0.08);
            animation: popInModal 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .quick-view-content::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212,175,55,0.12), transparent 70%);
            pointer-events: none;
        }
        @keyframes popInModal {
            from { transform: scale(0.92) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .close-modal {
            position: absolute;
            top: 14px;
            right: 18px;
            color: var(--gold, #d4af37);
            font-size: 1.6rem;
            cursor: pointer;
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            z-index: 5;
        }
        .close-modal:hover {
            background: var(--gold, #d4af37);
            color: #000;
            transform: rotate(90deg);
        }
        .modal-product-img {
            border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-desc-text {
            color: var(--text-muted, #aaa);
            font-size: 0.92rem;
            line-height: 1.7;
            margin-bottom: 22px;
        }
        .product-card { cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo" aria-label="Calvier Essence home"><img src="assets/calvier-essence-logo.svg" class="brand-logo-image" alt="Calvier Essence"></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="signature.html">Signature Perfumes</a></li>
            <li><a href="collection.html" class="active">Collection</a></li>
            <li><a href="policies.html?tab=about">About Us</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" class="cart-btn">
                <i class="fa-solid fa-bag-shopping"></i> Bag (<span id="cartCount">0</span>)
            </a>
        </div>
    </header>

<!-- Main Content -->
    <main class="section-container">
        <div style="text-align:center; margin-bottom: 20px;">
            <span style="color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;">Explore Collections</span>
            <h2 style="font-size: 2.5rem; font-family: 'Cinzel', serif; margin-top: 10px;">Our Collections</h2>
            <p style="color: var(--text-muted);">Kisi bhi collection par click karein aur uske exclusive products dekhein.</p>
        </div>

        <div id="collections-container">
            <p style="text-align:center; color: var(--text-muted);">Loading collections...</p>
        </div>
    </main>

    <!-- Quick View Modal -->
    <div id="quickViewModal" class="quick-view-modal">
        <div class="quick-view-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div style="flex: 1; min-width: 280px;">
                <img id="modalImg" src="" alt="Product" class="modal-product-img" style="width: 100%; object-fit: cover; max-height: 350px;">
            </div>
            <div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; justify-content: center;">
                <span style="color: var(--gold); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">✦ Calvier Essence ✦</span>
                <h2 id="modalTitle" style="font-family: 'Cinzel', serif; font-size: 2rem; color: #fff; margin: 5px 0 8px 0; line-height: 1.2;"></h2>
                <div id="modalPrice" style="color: var(--gold); font-size: 1.6rem; font-weight: 700; margin-bottom: 12px;"></div>
                <div id="modalStock" style="font-size: 0.8rem; margin-bottom: 14px;"></div>
                <p id="modalDesc" class="modal-desc-text"></p>
                <button id="modalAddToBag" class="card-btn" style="text-align: center; width: 100%; padding: 14px; font-weight: 600; letter-spacing: 1px; border-radius: 8px; background: linear-gradient(135deg, var(--gold, #d4af37), #aa8537); color: #0b0b0b; border: none; cursor: pointer; transition: 0.3s;" onclick="addToBagFromModal()">Add to Bag</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', async () => {
        const collectionsContainer = document.getElementById('collections-container');
        if (!collectionsContainer) return;

        try {
            const [allProducts, collections] = await Promise.all([
                fetch('/api/products').then(res => res.json()),
                fetch('/api/collections').then(res => res.json())
            ]);

            const productList = Array.isArray(allProducts) ? allProducts : [];

            // ===== 0. SPECIFIC COLLECTION VIEW (?id=...) =====
            const urlParams = new URLSearchParams(window.location.search);
            const specificCollectionId = urlParams.get('id');
            if (specificCollectionId) {
                const target = (Array.isArray(collections) ? collections : []).find(c => String(c.id || '').toLowerCase().trim() === String(specificCollectionId || '').toLowerCase().trim());
                    console.log('collection debug: requestedId=', specificCollectionId, 'found=', !!target);
                const heading = document.querySelector('main .section-container > div');
                if (heading) {
                    const h2 = heading.querySelector('h2');
                    const p = heading.querySelector('p');
                    if (h2) h2.innerText = target ? target.name : 'Collection Not Found';
                    if (p) p.innerText = target ? 'Sirf is collection ke products dekhein.' : 'Requested collection nahi mili.';
                }
                if (target) {
                    const assignedCats = target.categories || [];
                    const normCats = assignedCats.map(c => String(c).toUpperCase().trim());
                    const productsInCollection = productList.filter(p => normCats.includes(String(p.category || '').toUpperCase().trim()));
                    let html = '<div class="collection-group"><h2 class="collection-title">'+target.name+'</h2><div class="product-grid">';
                    if (productsInCollection.length > 0) {
                        html += productsInCollection.map(p => window.generateProductCardHTML(p)).join('');
                    } else {
                        html += '<p class="collection-empty">Is collection mein abhi koi product nahi hai.</p>';
                    }
                    html += '</div></div>';
                    collectionsContainer.innerHTML = html;
                } else {
                    collectionsContainer.innerHTML = '<p class="collection-empty">The requested collection was not found.</p>';
                }
                return;
            }

            // ===== ALL COLLECTIONS CARDS (ek hi grid mein) =====
            if (!Array.isArray(collections) || collections.length === 0) {
                collectionsContainer.innerHTML = '<p class="collection-empty">No collections have been set up yet.</p>';
                return;
            }

            let collHTML = '<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:25px;">';
            collections.forEach(collection => {
                const assignedCats = collection.categories || [];
                const img = collection.image || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=800';
                const catsLabel = assignedCats.join(' • ') || 'View Collection';
                collHTML += `
                    <a href="collection.html?id=${collection.id}" style="position:relative;display:block; background:var(--card-bg); border:1px solid var(--border-color); border-radius:15px; overflow:hidden; text-decoration:none; transition:0.3s; box-shadow:0 10px 25px rgba(0,0,0,0.4);">
                        <img src="${img}" alt="${collection.name}" style="width:100%; height:280px; object-fit:cover; display:block;">
                        <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.92), transparent 60%);"></div>
                        <div style="position:absolute; bottom:0; left:0; right:0; padding:22px;">
                            <h3 style="font-family:'Cinzel',serif; color:#fff; font-size:1.4rem; margin:0 0 4px 0;">${collection.name}</h3>
                            <p style="color:var(--gold); font-size:0.8rem; letter-spacing:1px; text-transform:uppercase;">${catsLabel}</p>
                        </div>
                    </a>`;
            });
            collHTML += '</div>';
            collectionsContainer.innerHTML = collHTML;

        } catch (error) {
            console.error('Failed to load collections:', error);
            collectionsContainer.innerHTML = '<p class="collection-empty">Could not load collections. Please try again later.</p>';
        }
    });
    </script>
</body>
</html>

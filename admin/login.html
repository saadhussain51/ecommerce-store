<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Calvier Essence</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #f0d77a;
            --dark: #090909;
            --dark-2: #111111;
            --panel: rgba(19, 19, 19, 0.96);
            --border: rgba(212, 175, 55, 0.22);
            --text: #f8f5ee;
            --muted: #bcb7ab;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(212, 175, 55, 0.15), transparent 28%),
                linear-gradient(135deg, #0b0b0b 0%, #131313 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
        }
        .login-container {
            background: linear-gradient(180deg, rgba(24,24,24,0.96), rgba(12,12,12,0.96));
            padding: 34px 28px;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.18);
            width: min(92vw, 380px);
            border: 1px solid var(--border);
        }
        h2 {
            text-align: center;
            margin: 0 0 24px 0;
            color: var(--gold-soft);
            letter-spacing: 0.10em;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold-soft);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            box-sizing: border-box;
            background: rgba(10,10,10,0.9);
            color: #fff;
            outline: none;
            transition: 0.25s ease;
        }
        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8537);
            color: #0b0b0b;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.25s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(212,175,55,0.18);
        }
        #error-msg {
            color: #ff7b7b;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="../assets/calvier-essence-logo.svg" alt="Calvier Essence" style="display:block;width:190px;height:80px;object-fit:contain;margin:0 auto 12px;">
        <h2>Calvier Essence Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="owner@baytaloud.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="admin123">
            </div>
            <button type="submit">Login</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save the token in localStorage.
                    localStorage.setItem('token', data.token);
                    // Redirect to the dashboard.
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed';
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Please try again.';
            }
        });
    </script>

</body>
</html>
